name: Windows Build
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Connectfon.sln
      - name: Build
        run: dotnet build Connectfon.sln -c Release --no-restore
      - name: Publish EXE
        run: dotnet publish src/Connectfon.UI/Connectfon.UI.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -o publish
      - name: Package
        shell: pwsh
        run: |
          $exe = Get-ChildItem publish -Filter Connectfon.exe
          if (-not $exe) { throw 'Connectfon.exe was not produced' }
          if ((Get-ChildItem publish | Measure-Object).Count -ne 1) { throw 'Publish folder does not contain exactly one file' }
          Copy-Item $exe.FullName .\Connectfon.exe
          Get-FileHash .\Connectfon.exe -Algorithm SHA256 | Format-List
      - name: Upload EXE package
        uses: actions/upload-artifact@v4
        with:
          name: Connectfon-win-x64
          path: Connectfon.exe
      - name: Build report
        shell: pwsh
        run: |
          "Connectfon Windows build completed on $env:RUNNER_OS" | Out-File build-report.txt
          dotnet --info | Out-File -Append build-report.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Connectfon-build-report
          path: build-report.txt
